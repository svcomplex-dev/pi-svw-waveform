name: Publish npm package

on:
  push:
    tags:
      - "v*.*.*"
  repository_dispatch:
    types: [svw-release-published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'repository_dispatch' && 'main' || github.ref }}
      # Keep registry-url unset: an empty setup-node auth entry suppresses npm OIDC.
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.16.0
      - name: Verify GitHub OIDC environment
        shell: bash
        run: |
          test "$(npm --version)" = "11.16.0"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -z "${NODE_AUTH_TOKEN:-}"
      - name: Prepare dispatched svw release
        if: github.event_name == 'repository_dispatch'
        id: prepare
        env:
          SVW_RELEASE_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -eu
          sh scripts/setup-git-hooks.sh
          node scripts/prepare-svw-release.mjs "$SVW_RELEASE_TAG"
      - name: Verify tag and package version
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          version=$(node -p "require('./package.json').version")
          test "$REF_NAME" = "v$version"
      - name: Install development dependencies without product bootstrap
        env:
          SVW_PI_SKIP_INSTALL: "1"
        run: npm ci
      - name: Verify package
        run: |
          npm run verify
          sh test/git-hooks.sh
      - name: Decide whether dispatched release needs publication
        if: github.event_name == 'repository_dispatch'
        id: decision
        env:
          PACKAGE_VERSION: ${{ steps.prepare.outputs.package_version }}
        run: |
          set -eu
          if npm view "pi-svw-waveform@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Smoke test the immutable svw release
        if: github.event_name == 'repository_dispatch' && steps.decision.outputs.should_publish == 'true'
        env:
          SVW_PI_VERSION: ${{ steps.prepare.outputs.svw_release }}
        run: |
          npm run bootstrap
          npm run smoke:pi
      - name: Commit dispatched release and annotated package tag
        if: github.event_name == 'repository_dispatch' && steps.prepare.outputs.changed == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.prepare.outputs.package_version }}
          SVW_RELEASE_TAG: ${{ steps.prepare.outputs.svw_release }}
        run: |
          set -eu
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m "release: track svw $SVW_RELEASE_TAG"
          scripts/check-commit-emails.sh HEAD
          git tag -a "v$PACKAGE_VERSION" -m "pi-svw-waveform $PACKAGE_VERSION for $SVW_RELEASE_TAG"
          git push origin HEAD:main "refs/tags/v$PACKAGE_VERSION"
      - name: Publish to npm
        if: github.event_name == 'push' || steps.decision.outputs.should_publish == 'true'
        shell: bash
        run: |
          set +e
          publish_output=$(npm publish --access public --provenance 2>&1)
          publish_status=$?
          set -e
          printf '%s\n' "$publish_output"
          if (( publish_status != 0 )); then
            diagnostic=$(printf '%s\n' "$publish_output" | tail -n 20)
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            printf '::error title=npm publish failed::%s\n' "$diagnostic"
          fi
          exit "$publish_status"
