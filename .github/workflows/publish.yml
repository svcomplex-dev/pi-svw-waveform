name: Publish npm package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1
      - name: Verify tag and package version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          version=$(node -p "require('./package.json').version")
          test "$REF_NAME" = "v$version"
      - name: Install development dependencies without product bootstrap
        env:
          SVW_PI_SKIP_INSTALL: "1"
        run: npm ci
      - name: Verify package
        run: npm run verify
      - name: Publish to npm
        shell: bash
        run: |
          set +e
          publish_output=$(npm publish --access public 2>&1)
          publish_status=$?
          set -e
          printf '%s\n' "$publish_output"
          if (( publish_status != 0 )); then
            diagnostic=$(printf '%s\n' "$publish_output" | tail -n 20)
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            printf '::error title=npm publish failed::%s\n' "$diagnostic"
          fi
          exit "$publish_status"
