name: Package CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          cache: npm
      - name: Install development dependencies without product bootstrap
        env:
          SVW_PI_SKIP_INSTALL: "1"
        run: npm ci
      - name: Verify package contracts
        run: npm run verify
      - name: Install and smoke test public svw
        run: npm run bootstrap
      - name: Load package in Pi RPC
        run: npm run smoke:pi
